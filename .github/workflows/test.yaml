name: Tests
on:
  push:
    branches:
      - master
      - 'release-*'
      - diag-e2e-resources
  pull_request:
    branches:
      - master
      - 'release-*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        type: environment
        required: true

env:
  TEST_USERNAME: admin
  TEST_PASSWORD: password
  CATTLE_BOOTSTRAP_PASSWORD: password
  TEST_BASE_URL: https://127.0.0.1.sslip.io
  API: https://127.0.0.1.sslip.io
  # Build the dashboard to use in tests. When set to false it will grab `latest` from CDN (useful for running e2e tests quickly)
  BUILD_DASHBOARD: true

  E2E_RANCHER_LOG: rancher.log
  E2E_BUILD_DIST_NAME: dist
  E2E_BUILD_DIST_DIR: dist
  E2E_BUILD_DIST_EMBER_NAME: dist_ember
  E2E_BUILD_DIST_EMBER_DIR: dist_ember

jobs:
  extract-e2e-runtime-rancher-version:
    runs-on: ubuntu-latest
    outputs:
      runtime-rancher-version: ${{ steps.extract.outputs.runtime-rancher-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - name: Extract Rancher version
        id: extract
        run: |
          BRANCH_DATA=$(./scripts/get-branch-metadata.sh ${{ github.base_ref || github.ref_name }} --local 2>/dev/null)
          VERSION=$(echo "$BRANCH_DATA" | jq -r '.e2e["runtime-rancher-version"]')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Warning: Rancher version not found for branch '${{ github.base_ref || github.ref_name }}', 'runtime-rancher-version' will be empty."
          fi
          echo "runtime-rancher-version=$VERSION" >> "$GITHUB_OUTPUT"

  e2e-ui-build:
    if: "!contains( github.event.pull_request.labels.*.name, 'ci/skip-e2e')"
    needs: extract-e2e-runtime-rancher-version
    runs-on: ubuntu-latest
    outputs:
      runtime-rancher-version: ${{ needs.extract-e2e-runtime-rancher-version.outputs.runtime-rancher-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - name: Setup env
        uses: ./.github/actions/setup
      - name: Build e2e
        run: yarn e2e:build
      - name: Upload e2e build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.E2E_BUILD_DIST_NAME }}
          path: ${{ env.E2E_BUILD_DIST_DIR }}/
          if-no-files-found: error
          retention-days: 10
          compression-level: 9
      - name: Upload e2e build ember
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.E2E_BUILD_DIST_EMBER_NAME }}
          path: ${{ env.E2E_BUILD_DIST_EMBER_DIR }}/
          if-no-files-found: error
          retention-days: 10
          compression-level: 9

  e2e-test:
    if: "!contains( github.event.pull_request.labels.*.name, 'ci/skip-e2e')"
    needs: e2e-ui-build
    strategy:
      fail-fast: false
      matrix:
        role: [
          { username: 'admin', tag: '@adminUser' }
        ]
        features:  [
          ['@explorer2'],
          ['@manager'],
        ]
        arm: [base, novideo]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1
      - name: Setup env
        uses: ./.github/actions/setup

      # Installing fixed version of Chrome since latest version does not work (128 didn't work)
      # Leaving this here again in case we need to pin to a specific Chrome version in the future
      # - name: Install Chrome
      #   uses: ./.github/actions/install-chrome
      #   with:
      #     chrome-version: '143.0.7499.192-1'
      #     chrome-version-checksum:

      - name: Start resource monitor
        run: |
          nproc
          free -m
          lscpu | grep -E 'Model name|^CPU\(s\)'
          nohup ./scripts/diag-resmon.sh > /tmp/resmon.log 2>&1 &

      - name: Download e2e build
        uses:  actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
         name: ${{ env.E2E_BUILD_DIST_NAME }}
         path: ${{ env.E2E_BUILD_DIST_DIR }}
      - name: Download e2e build ember
        uses:  actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
         name: ${{ env.E2E_BUILD_DIST_EMBER_NAME }}
         path: ${{ env.E2E_BUILD_DIST_EMBER_DIR }}
      
      - name: Run Rancher
        run: yarn e2e:k3s
      
      - name: Setup Rancher and user
        run: |
          yarn e2e:prod
        env: 
          RANCHER_VERSION: ${{ needs.e2e-ui-build.outputs.runtime-rancher-version }}
          GREP_TAGS: ${{ matrix.role.tag }}Setup+${{ matrix.features[0] }} --@jenkins ${{ matrix.role.tag }}Setup+${{ matrix.features[1] || matrix.features[0] }} --@jenkins
          TEST_USERNAME: admin
          TEST_ONLY: setup
      - name: Detect Rancher license (Prime vs Community)
        id: detect-prime
        run: |
          IS_PRIME=$(curl -sk "$API/rancherversion" | jq -r '.RancherPrime // "false"')
          echo "Detected RancherPrime=$IS_PRIME"
          echo "is-prime=$IS_PRIME" >> "$GITHUB_OUTPUT"

      - name: Run user tests
        run: |
          yarn e2e:prod
          [ "$BUILD_DASHBOARD" != "false" ] || exit 0
        env:
          RANCHER_VERSION: ${{ needs.e2e-ui-build.outputs.runtime-rancher-version }}
          TEST_SKIP: setup
          TEST_NO_VIDEOS: ${{ matrix.arm == 'novideo' }}
          GREP_TAGS: ${{ matrix.role.tag }}+${{ matrix.features[0] }} --@jenkins${{ steps.detect-prime.outputs.is-prime == 'true' && ' --@noPrime' || '' }} ${{ matrix.role.tag }}+${{ matrix.features[1] || matrix.features[0] }} --@jenkins${{ steps.detect-prime.outputs.is-prime == 'true' && ' --@noPrime' || '' }}
          TEST_USERNAME: ${{ matrix.role.username }}

      - name: Resource monitor log
        if: ${{ always() }}
        run: cat /tmp/resmon.log

      - name: Fetch Rancher Logs
        if: ${{ failure() }}
        run: yarn k3s:local:logs

      - name: Create Artifacts Folder
        if: ${{ always() }}
        run: |
          mkdir artifacts
          cp -r cypress/screenshots artifacts 2>/dev/null || :
          cp -r cypress/videos artifacts 2>/dev/null || :
          cp -r cypress/reports/* artifacts || :
          cp ${{ env.E2E_RANCHER_LOG }} artifacts/rancher.logs 2>/dev/null || :
          cp browser-logs/out.html artifacts/browser-logs.html 2>/dev/null || :

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: ${{github.run_number}}-${{github.run_attempt}}-artifacts-${{ matrix.role.tag }}${{ matrix.features[0] }}${{ matrix.features[1] }}-${{ matrix.arm }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 5
          compression-level: 9

